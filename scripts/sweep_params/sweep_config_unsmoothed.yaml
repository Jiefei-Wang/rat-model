method: random
name: sweep_unsmoothed_auc_random
metric:
  name: val_auc
  goal: maximize
parameters:
  smoothed:
    value: false
  prominence:
    values: [0.5, 1.0, 2.0, 3.0, 5.0, 8.0]
  height:
    values: [3.0, 5.0, 8.0, 10.0, 15.0, 20.0]
    distance:
    values: [1, 3, 5, 10, 20, 50]
  width:
    values: [null, 1.0, 2.0, 3.0]
  wlen:
    values: [null]    
  threshold:
    values: [null, 0.0, 0.5, 1.0, 2.0]
  rel_height:
    values: [0.5, 0.6, 0.7, 0.8]
  plateau_size:
    values: [null, 1.0, 2.0, 3.0, 5.0]
  duration_threshold: 
    values: [10, 15, 20, 25, 30]
program: peak_param_sweep.py
command:
  - ${env}
  - python
  - ${program}
